# ============================================================
# RECORDER — allowlist by domain, prune noisy sensors by glob
# Raw history: 10 days. Long-term statistics (state_class
# sensors) are kept indefinitely and are NOT affected by
# purge_keep_days.
# ============================================================
recorder:
  purge_keep_days: 10
  auto_purge: true
  commit_interval: 15        # fewer, larger writes; no effect on DB size

  include:
    domains:
      - sensor
      - device_tracker
      # - climate            # uncomment to get thermostat mode/setpoint history
      # - binary_sensor      # uncomment for door/occupancy/leak history
    entities:
      # pinned: long-term HVAC trend pair (explicit include beats any exclude glob)
      - sensor.hvac_supply_water_temperature
      - sensor.hvac_supply_water_temperature_old
      - sensor.climate_outdoor_temperature

  exclude:
    entities:
      - sensor.climate_outdoor_pressure
      - sensor.ross_cameron_warrior_trading
      - sensor.noaa_tides
      - sensor.flight_info
      - sensor.nsp3_current_page
      - sensor.nsp3_detailed_entity
      # --- added 2026-10-24 ---
      - sensor.current_amps_2          # ~13.5k rows/day, duplicate of excluded L1/L2 current
      - sensor.processor_use           # HA VM CPU; Proxmox already tracks it
      - sensor.memory_use_percent      # HA VM RAM; Proxmox already tracks it
    entity_globs:
      # --- existing ---
      - sensor.ups_*
      - sensor.*_uptime
      - sensor.node_proxmox*
      - sensor.qemu*
      # --- proxmox globs your old ones missed ---
      - sensor.network_node_proxmox_*
      - sensor.proxmox_cluster_*
      # --- high-rate device telemetry ---
      - sensor.m5core2_mpu6886_*
      - sensor.*_heap_free
      - sensor.*_psram_free
      - sensor.*_wifi_signal*
      - sensor.*_processor_usage
      # --- BLE / Bermuda (distance churns constantly; area is kept) ---
      - sensor.ble_*_distance
      - sensor.ble_*_estimated_distance
      - sensor.bermuda_global_*
      # --- electrical noise: keep *_power and *_energy, drop derivatives ---
      - sensor.*_voltage
      - sensor.*_current
      - sensor.*_ac_frequency
      - sensor.*_power_factor
      - sensor.*_instantaneous_demand
      - sensor.*_smartenergy_metering
      # --- companion app chatter ---
      - sensor.*_geocoded_location
      - sensor.*_last_update_trigger
      - sensor.*_bssid
      - sensor.*_kiosk_*
      # --- misc low-value / large-attribute ---
      - sensor.watchman_*
      - sensor.vestaboard_*
      - sensor.album_art_*
      - sensor.time_*
      - sensor.nsp3_version_*
